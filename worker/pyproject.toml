[project]
name = "energy-desk-worker"
version = "0.1.0"
description = "Ingestion, transforms, forecasts and backtests for Energy Desk."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["worker", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
