[project]
name = "energy-desk-worker"
version = "0.1.0"
description = "Ingestion, transforms, forecasts and backtests for Energy Desk."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "tenacity>=9.2.1",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "respx>=0.23.1",
    "ruff>=0.8",
    "types-openpyxl>=3.1.5.20261017",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["worker", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
