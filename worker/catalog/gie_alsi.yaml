# GIE ALSI — EU LNG terminals, daily per gas day. Same API and terms as AGSI+ (see gie_agsi.yaml):
# free reuse, GIE / ALSI credit mandatory underneath the data (https://agsi.gie.eu/data-usage, read
# 2026-10-28; the rules cover AGSI and ALSI). The United Kingdom has no data since Brexit (declared gap).
# Units checked live: inventory and DTMI in GWh (`inventory.gwh`, `dtmi.gwh`), send-out in GWh/d.
# Plausible ranges are generous physical bounds: they catch unit errors, not records.
source: gie_alsi
licence:
  name: GIE Transparency Platform — free reuse, source referral mandatory
  url: https://agsi.gie.eu/data-usage
  attribution: "Source: GIE ALSI (Gas Infrastructure Europe)."
