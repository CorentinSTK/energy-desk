# GIE ALSI — EU LNG terminals, daily per gas day. Same API and terms as AGSI+ (see gie_agsi.yaml):
# free reuse, GIE / ALSI credit mandatory underneath the data (https://agsi.gie.eu/data-usage, read
# 2026-10-28; the rules cover AGSI and ALSI). The United Kingdom has no data since Brexit (declared gap).
# Units checked live: inventory and DTMI in GWh (`inventory.gwh`, `dtmi.gwh`), send-out in GWh/d.
# Plausible ranges are generous physical bounds: they catch unit errors, not records.
source: gie_alsi
licence:
  name: GIE Transparency Platform — free reuse, source referral mandatory
  url: https://agsi.gie.eu/data-usage
  attribution: "Source: GIE ALSI (Gas Infrastructure Europe)."
licence_checked: 2026-10-28
series:
  - code: alsi.eu.inventory
    name: EU LNG terminal inventory
    commodity: lng
    region: EU
    unit: "GWh"
    frequency: daily
    source_ref: "EU|inventory.gwh"
    description: LNG in storage at the terminals at the end of the gas day, in energy terms.
    publication_lag_days: 1
    plausible_min: 0
    plausible_max: 80000
  - code: alsi.eu.send_out
    name: EU LNG send-out
    commodity: lng
    region: EU
    unit: "GWh/d"
    frequency: daily
    source_ref: "EU|sendOut"
    description: Regasified LNG sent into the grid during the gas day.
    publication_lag_days: 1
    plausible_min: 0
    plausible_max: 15000
  - code: alsi.eu.dtmi
    name: EU LNG declared total maximum inventory
    commodity: lng
    region: EU
    unit: "GWh"
    frequency: daily
    source_ref: "EU|dtmi.gwh"
    description: Declared maximum LNG inventory (storage capacity) of the terminals.
    publication_lag_days: 1
    plausible_min: 0
    plausible_max: 160000
