# Elexon Insights Solution (BMRS) — GB market index price, generation by fuel and demand, no key.
# Licence: BMRS data licence (https://www.elexon.co.uk/data/balancing-mechanism-reporting-agent/copyright-licence-bmrs-data/):
# worldwide, royalty-free, perpetual licence to copy, publish, distribute and adapt, including commercially;
# the statement "Contains BMRS data © Elexon Limited copyright and database right <year>" is mandatory, with
# a link to the licence where possible; no suggestion of official status or Elexon endorsement, and no
# misrepresentation of the data. Full text read in a browser by the project owner on 2026-10-29 (the page
# blocks automated requests).
# Daily series are averages over complete Europe/London days (worker/power.py).
# Plausible ranges are generous physical bounds: they catch unit errors, not records.
source: elexon
licence:
  name: Elexon BMRS data licence
  url: https://www.elexon.co.uk/data/balancing-mechanism-reporting-agent/copyright-licence-bmrs-data/
  attribution: "Contains BMRS data © Elexon Limited copyright and database right 2026."
licence_checked: 2026-10-29
series:
  - code: elexon.gb.mid
    name: GB market index price (Elexon MID), half-hourly
    commodity: power
    region: GB
    unit: "£/MWh"
    frequency: half_hourly
    source_ref: "mid|half_hourly"
    description: Volume-weighted index of short-term trades on EPEX SPOT (APX provider) per settlement period. An index, not a day-ahead auction price.
    price_kind: index
    plausible_min: -1000
    plausible_max: 10000
  - code: elexon.gb.mid_base
    name: GB market index price (Elexon MID), daily average
    commodity: power
    region: GB
    unit: "£/MWh"
    frequency: daily
    gap_threshold_days: 1  # published for every calendar day
    source_ref: "mid|daily_mean"
    description: Time-average of the half-hourly market index over the day (Europe/London), complete days with trades in every period only.
    price_kind: index
    plausible_min: -1000
    plausible_max: 10000
  - code: elexon.gb.demand
    name: GB national demand (INDO)
    commodity: power
    region: GB
    unit: "MW"
    frequency: daily
    gap_threshold_days: 1  # published for every calendar day
    source_ref: "demand|initialDemandOutturn"
    description: Initial national demand outturn, average power over the day. Transmission-metered; demand met by embedded solar and wind is not included.
    publication_lag_days: 1
    plausible_min: 10000
    plausible_max: 60000
