# Open-Meteo historical weather for Germany (archive API, no key): inputs of the day-ahead power price
# forecasts (ADR 0016). Same provider and terms as open_meteo.yaml (read 2026-10-30, rechecked
# 2026-11-25): CC BY 4.0, "Weather data by Open-Meteo.com"; ERA5 reanalysis (Copernicus C3S); free API
# for non-commercial use, under 10,000 calls a day.
# Locations are chosen, not weighted: wind sites where German onshore and offshore capacity
# concentrates (North Sea and Baltic, the northern coasts, Saxony-Anhalt, Brandenburg); solar sites in
# the states with the most photovoltaic capacity (Bavaria, Baden-Württemberg, North Rhine-Westphalia,
# Lower Saxony, Berlin-Brandenburg). The models average them without weights.
source: open_meteo_de
licence:
  name: Open-Meteo — CC BY 4.0 (ERA5 reanalysis, Copernicus C3S)
  url: https://open-meteo.com/en/licence
  attribution: "Weather data by Open-Meteo.com (CC BY 4.0); contains modified Copernicus Climate Change Service information."
licence_checked: 2026-11-25
series:
  - code: open_meteo_de.wind.german_bight
    name: German Bight (North Sea offshore) daily mean wind speed at 100 m
    commodity: weather
    region: German Bight
    unit: km/h
    frequency: daily
    gap_threshold_days: 1
    source_ref: "54.35,6.25|wind100"
    description: Daily mean of the hourly wind speed at 100 m (local day, Europe/Berlin), reanalysis. Input of the day-ahead power price forecasts.
    publication_lag_days: 6
    plausible_min: 0
    plausible_max: 200
