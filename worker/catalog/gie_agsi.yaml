# GIE AGSI+ — European gas storage, daily per gas day.
# Terms (read 2026-10-28, https://agsi.gie.eu/data-usage): free use and redistribution "in any way, shape
# or format", on the explicit condition that GIE / AGSI is clearly credited as the source underneath
# the data. Without that credit GIE may withdraw the API key.
# The United Kingdom has no data in AGSI since Brexit: GB storage is a declared data gap.
# Plausible ranges are generous physical bounds: they catch unit errors (x1000), not records.
# (A first backfill showed EU injection above 6,500 GWh/d in May 2022.)
source: gie_agsi
licence:
  name: GIE Transparency Platform — free reuse, source referral mandatory
  url: https://agsi.gie.eu/data-usage
  attribution: "Source: GIE AGSI+ (Gas Infrastructure Europe)."
licence_checked: 2026-10-28
series:
  - code: agsi.eu.storage
    name: EU gas in storage
    commodity: natgas
    region: EU
    unit: "TWh"
    frequency: daily
    source_ref: EU|gasInStorage
    description: Gas in storage at the end of the gas day.
    publication_lag_days: 1  # gas day D is published on the evening of D+1
    plausible_min: 0
    plausible_max: 1300
  - code: agsi.eu.full
    name: EU storage filling level
    commodity: natgas
    region: EU
    unit: "%"
    frequency: daily
    source_ref: EU|full
    description: Gas in storage as a share of working gas volume.
    publication_lag_days: 1  # gas day D is published on the evening of D+1
    plausible_min: 0
    plausible_max: 105
  - code: agsi.eu.injection
    name: EU storage injection
    commodity: natgas
    region: EU
    unit: "GWh/d"
    frequency: daily
    source_ref: EU|injection
    description: Gas injected into storage during the gas day.
    publication_lag_days: 1  # gas day D is published on the evening of D+1
    plausible_min: 0
    plausible_max: 25000
  - code: agsi.eu.withdrawal
    name: EU storage withdrawal
