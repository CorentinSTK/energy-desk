    name: Net physical flow France → Germany-Luxembourg
    commodity: power
    region: "FR→DE-LU"
    unit: MW
    frequency: daily
    gap_threshold_days: 1
    source_ref: "flow|FR|DE_LU"
    description: Daily average of the hourly physical flow France → Germany-Luxembourg minus the reverse flow; positive when France exports.
