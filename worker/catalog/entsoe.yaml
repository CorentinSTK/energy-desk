# ENTSO-E Transparency Platform — net cross-border physical flows between the power zones of the site.
# Terms (read 2026-11-25): Terms of Use of 29/03/2023 and the "List of data available for free re-use"
# of 18/10/2023 (pasted by the owner from the platform's help centre). Physical flows (art. 12.1.g,
# item 18) are on the list: free re-use under CC BY 4.0, crediting the source and indicating changes.
# Data not on the list (generation, generation outages, actual load, prices) is never ingested.
# Values: daily average of the hourly net flow FROM→TO in MW (Europe/Brussels days, complete days only);
# positive = FROM exports. Endpoint, zones and units checked live on 2026-11-25 (worker/sources/entsoe.py).
source: entsoe
licence:
  name: CC BY 4.0
  url: https://creativecommons.org/licenses/by/4.0/
  attribution: "Source: ENTSO-E Transparency Platform (CC BY 4.0); daily averages of net hourly flows computed by Energy Desk."
licence_checked: 2026-11-25
series:
