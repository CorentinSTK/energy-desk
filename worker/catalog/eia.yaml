    frequency: weekly
    source_ref: petroleum/cons/wpsup|WRPUPUS2
    description: U.S. product supplied of all petroleum products, thousand barrels per day. A demand proxy.
    publication_lag_days: 5
    plausible_min: 10000
    plausible_max: 26000
