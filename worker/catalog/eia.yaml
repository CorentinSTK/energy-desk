    commodity: products
    region: US
    unit: kb/d
    source_unit: MBBL/D
    frequency: weekly
    source_ref: petroleum/move/wkly|WDIEXUS2
    description: U.S. exports of total distillate, thousand barrels per day (weekly estimates).
    publication_lag_days: 5
    plausible_min: 0
    plausible_max: 3000
  - code: eia.us_gasoline_exports
    name: US motor gasoline exports
    commodity: products
    region: US
    unit: kb/d
    source_unit: MBBL/D
    frequency: weekly
    source_ref: petroleum/move/wkly|W_EPM0F_EEX_NUS-Z00_MBBLD
    description: U.S. exports of total motor gasoline, thousand barrels per day (weekly estimates).
    publication_lag_days: 5
    plausible_min: 0
