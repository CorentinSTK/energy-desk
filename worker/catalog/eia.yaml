    source_unit: MBBL/D
    frequency: weekly
    source_ref: petroleum/cons/wpsup|WDIUPUS2
    description: U.S. product supplied of distillate fuel oil, thousand barrels per day. A demand proxy, noisy week to week.
    publication_lag_days: 5
    plausible_min: 1000
    plausible_max: 7000
  - code: eia.us_jet_supplied
    name: US kerosene-type jet fuel product supplied
    commodity: products
    region: US
    unit: kb/d
    source_unit: MBBL/D
    frequency: weekly
    source_ref: petroleum/cons/wpsup|WKJUPUS2
    description: U.S. product supplied of kerosene-type jet fuel, thousand barrels per day. A demand proxy.
    publication_lag_days: 5
    plausible_min: 200
    plausible_max: 2500
