# IMF PortWatch — daily transit calls through maritime chokepoints, from AIS vessel signals.
# Service: Daily_Chokepoints_Data (ArcGIS, owner IMF-portwatch_imf_dataviz), checked live 2026-11-20:
# one row per chokepoint and day since 2019-01-01, about five days of publication lag; `source_ref`
# is "<PortWatch chokepoint id>|<field>". A transit spanning several days is counted once.
# Licence: IMF Copyright and Usage terms (linked from the ArcGIS item and the HDX datasets). Reuse
# and publication with attribution; commercial use and automated downloading need IMF permission.
# Requested by the owner; ingested meanwhile by the owner's decision (ADR 0013).
# Plausible ranges are generous physical bounds (Malacca, the busiest, sees about 240 ships a day).
source: portwatch
licence:
  name: IMF Copyright and Usage — reuse with attribution; automated access by permission
  url: https://www.imf.org/en/about/copyright-and-terms
  attribution: "Source: International Monetary Fund, PortWatch (portwatch.imf.org)."
licence_checked: 2026-11-20
series:
  - code: portwatch.hormuz.transits
    name: Strait of Hormuz transits, all vessels
    commodity: freight
    region: Strait of Hormuz
    unit: "vessels/d"
    frequency: daily
    source_ref: "chokepoint6|n_total"
    description: "Ships crossing the chokepoint during the day, all vessel types (AIS transit calls)."
    publication_lag_days: 5
    gap_threshold_days: 1
    plausible_min: 0
    plausible_max: 1000
  - code: portwatch.hormuz.tanker_transits
    name: Strait of Hormuz tanker transits
    commodity: freight
    region: Strait of Hormuz
    unit: "vessels/d"
    frequency: daily
    source_ref: "chokepoint6|n_tanker"
    description: "Tankers crossing the chokepoint during the day (AIS transit calls)."
    publication_lag_days: 5
    gap_threshold_days: 1
    plausible_min: 0
    plausible_max: 500
  - code: portwatch.hormuz.tanker_tonnes
    name: Strait of Hormuz tanker cargo, IMF estimate
    commodity: freight
    region: Strait of Hormuz
    unit: "t/d"
    frequency: daily
    source_ref: "chokepoint6|capacity_tanker"
    description: "Estimated cargo carried by tankers crossing during the day: IMF model of each ship's payload times its deadweight tonnage. A model estimate, not a measured volume."
    publication_lag_days: 5
    gap_threshold_days: 1
    plausible_min: 0
    plausible_max: 30000000
