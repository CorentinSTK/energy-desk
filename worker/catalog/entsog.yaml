# ENTSOG Transparency Platform — physical flows at entry points into the EU, per gas day.
# Terms (ENTSOG TP Terms and Conditions of Use, Rev 3, art. 5, read 2026-10-28): download, store and use in
# good faith; quote the source and extraction date as "ENTSOG TP [DD-MM-YYYY] https://transparency.entsog.eu/".
# {extraction_date} is filled by the site from the last successful ingestion run.
# Only points reported by a single operator are listed; Norway → Germany (Emden, Dornum) is reported by
# several operators with overlapping values and is a declared gap (adding them up would double count).
# Values in kWh/d (source unit). Plausible maximum: 3,000 GWh/d per point.
source: entsog
licence:
  name: ENTSOG Transparency Platform — Terms and Conditions of Use (use in good faith, source and date quoted)
  url: https://transparency.entsog.eu/pdf/TRA0394_20161115_ENTSOG_TP_Privacy_TC_of_Use_Rev_3.pdf
  attribution: "Source: ENTSOG TP [{extraction_date}] https://transparency.entsog.eu/"
licence_checked: 2026-10-28
