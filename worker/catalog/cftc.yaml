# CFTC Commitments of Traders, disaggregated, futures only (dataset 72hh-3qpy).
# Terms (read 2026-10-30, https://www.cftc.gov/WebPolicy/index.htm): "Government information at the
# CFTC website is in the public domain" and may be freely distributed; the CFTC asks for appropriate
# acknowledgement. Raw long and short positions are stored; net positions are computed on the site.
# ICE Brent and ICE gasoil are not covered by the CFTC (ICE Futures Europe): declared gaps.
source: cftc
licence:
  name: CFTC — public domain
  url: https://www.cftc.gov/WebPolicy/index.htm
  attribution: "Source: U.S. Commodity Futures Trading Commission, Commitments of Traders."
