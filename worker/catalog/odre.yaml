# ODRÉ éCO2mix (RTE) — French electricity consumption, generation by fuel and exchanges, no key.
# Licence (read 2026-10-29 from the dataset metadata of eco2mix-national-tr and -cons-def): Licence
# Ouverte v2.0 (Etalab) — free reuse, including commercial, with attribution of the source and date.
# Every series is the average power (MW) over complete Europe/Paris days (worker/power.py), from
# consolidated data where published, real-time data otherwise (worker/sources/odre.py).
# Plausible ranges are generous physical bounds: they catch unit errors, not records.
source: odre
licence:
  name: Licence Ouverte v2.0 (Etalab)
  url: https://www.etalab.gouv.fr/licence-ouverte-open-licence/
  attribution: "Source: RTE éCO2mix, via ODRÉ (Licence Ouverte v2.0)."
licence_checked: 2026-10-29
series:
  - code: odre.fr.load
    name: France electricity consumption
    commodity: power
    region: FR
    unit: "MW"
    frequency: daily
    gap_threshold_days: 1  # published for every calendar day
    source_ref: consommation
    description: Consumption, average power over the day.
    publication_lag_days: 1
    plausible_min: 20000
    plausible_max: 110000
  - code: odre.fr.gen.nuclear
    name: France generation, nuclear
    commodity: power
    region: FR
    unit: "MW"
    frequency: daily
    gap_threshold_days: 1  # published for every calendar day
