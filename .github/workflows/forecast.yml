name: Forecast

# Live forecasts are issued once a day, after the inputs they use are ingested (ODRÉ and Open-Meteo
# at 14:15 UTC, GIE AGSI+ at 21:30 UTC); each model decides whether the day is one of its issue days
# (US crude stocks: Tuesdays). Backtests are run by hand. Live forecasts are never rewritten.
on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: Model
        type: choice
        options: [all, eu_storage_30d, fr_power_demand, us_crude_stocks]
      mode:
        description: Issue today's live forecasts, or run the walk-forward backtest
        type: choice
        options: [issue, backtest]
      since:
        description: Backtest start date (YYYY-MM-DD)
        default: "2019-01-01"

permissions:
  contents: read

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: worker
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2 # no floating major tag is published
        with:
          enable-cache: true
          cache-dependency-glob: worker/uv.lock
      - run: uv sync --locked --no-dev
      - name: Forecast
        env:
          MODEL: ${{ inputs.model || 'all' }}
          MODE: ${{ inputs.mode || 'issue' }}
          SINCE: ${{ inputs.since || '2019-01-01' }}
        run: |
          if [ "$MODE" = "backtest" ]; then
            uv run --no-dev python -m worker.forecast --model "$MODEL" --backtest --since "$SINCE"
          else
            uv run --no-dev python -m worker.forecast --model "$MODEL" --issue
          fi
